name: Self-scan

# repo-forensics scans its own code on every push and pull request. A security
# scanner always flags itself (it holds the patterns it hunts for), so the
# reviewed findings live in .github/selfscan-baseline.json and this job fails
# only on something new at medium severity or above.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: self-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Scan our own code against the known list
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/selfscan_gate.py

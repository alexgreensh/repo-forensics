name: Fuzz

# Coverage-guided fuzzing (Atheris) of the parsers that read attacker-controlled
# files. A crafted file that crashes or hangs a parser could silence a scanner,
# so any crash fails this job and its input is kept as an artifact.
# Targets run in one shell loop with literal names (no matrix expressions), so
# this file stays clean under our own workflow-injection rules.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked Atheris
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r .github/requirements/fuzz.txt

      - name: Fuzz each parser for 2 minutes
        run: |
          mkdir -p crashes
          status=0
          for target in capability_yaml pyproject_deps pnpm_lock encoded_blobs; do
            echo "::group::$target"
            python fuzz/fuzz_parsers.py "$target" \
              -max_total_time=120 -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix="crashes/$target-" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
          retention-days: 30
